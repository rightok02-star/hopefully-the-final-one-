<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corruption Protocol — JOI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="meter-wrap">
        <div class="meter-label" id="meterLabel">Still clean…</div>
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
        <div class="meter-percent" id="meterPercent">0%</div>
      </div>
      <div class="status" id="statusLine">JOI idle</div>
      <div class="header-actions">
        <button id="focusBtn" class="icon-btn" type="button" title="Focus">▣</button>
        <button id="settingsBtn" class="icon-btn" type="button" title="Settings">⚙</button>
      </div>
    </header>

    <div id="streakBar" class="streak-bar hidden"></div>
    <div id="achieveToast" class="achieve-toast hidden"></div>

    <main id="screen"></main>

    <footer>
      <button id="resetBtn" class="danger-btn" type="button">Wipe Active Slot</button>
    </footer>
  </div>

  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-panel">
      <h2>Settings</h2>
      <h3>JOI & voice</h3>
      <label class="setting-row">
        <span>Persona</span>
        <select id="setPersona"></select>
      </label>
      <label class="setting-row"><span>TTS narration</span><input type="checkbox" id="setTts" checked></label>
      <label class="setting-row"><span>Metronome</span><input type="checkbox" id="setMetronome" checked></label>
      <label class="setting-row"><span>Silence trials</span><input type="checkbox" id="setSilence" checked></label>
      <label class="setting-row"><span>Sound effects</span><input type="checkbox" id="setSfx" checked></label>
      <label class="setting-row"><span>Ambient</span><input type="checkbox" id="setAmbient"></label>
      <label class="setting-row"><span>Show media</span><input type="checkbox" id="setMedia" checked></label>
      <label class="setting-row"><span>Blur until climax phases</span><input type="checkbox" id="setBlur"></label>
      <label class="setting-row">
        <span>Volume</span>
        <input type="range" id="setVolume" min="0" max="100" value="45">
      </label>
      <label class="setting-row">
        <span>Timer scale</span>
        <select id="setTimerScale">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Intensity</span>
        <select id="setIntensity">
          <option value="0.85">Soft</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Harsh</option>
        </select>
      </label>

      <hr>
      <h3>Save slots</h3>
      <label class="setting-row">
        <span>Active slot</span>
        <select id="setSlot">
          <option value="0">Slot 1</option>
          <option value="1">Slot 2</option>
          <option value="2">Slot 3</option>
        </select>
      </label>
      <div class="btn-row tight">
        <button type="button" id="exportBtn" class="secondary">Export</button>
        <button type="button" id="importBtn" class="secondary">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>

      <hr>
      <h3>Rule34</h3>
      <input type="text" id="r34UserId" placeholder="User ID" autocomplete="off">
      <input type="password" id="r34ApiKey" placeholder="API Key" autocomplete="off">

      <hr>
      <h3>Playlist (one URL per line)</h3>
      <textarea id="playlistArea" rows="3" placeholder="https://..."></textarea>
      <button type="button" id="savePlaylistBtn" class="secondary">Save playlist</button>

      <hr>
      <h3>Custom fetish</h3>
      <input type="text" id="customName" placeholder="Name">
      <input type="text" id="customShort" placeholder="Short">
      <input type="text" id="customSearch" placeholder="ONE r34 tag">
      <button type="button" id="addCustomBtn">Add</button>

      <button type="button" id="closeSettings" class="secondary">Save &amp; Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
