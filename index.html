<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corruption Protocol</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="meter-wrap">
        <div class="meter-label" id="meterLabel">Still clean…</div>
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
        <div class="meter-percent" id="meterPercent">0%</div>
      </div>
      <div class="status" id="statusLine">No active corruption track</div>
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings">⚙</button>
    </header>

    <main id="screen"></main>

    <footer>
      <button id="resetBtn" class="danger-btn" type="button">Wipe All Progress (no mercy)</button>
    </footer>
  </div>

  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-panel">
      <h2>Settings</h2>
      <label class="setting-row"><span>Show media panel</span><input type="checkbox" id="setMedia" checked></label>
      <label class="setting-row"><span>Sound effects</span><input type="checkbox" id="setSfx" checked></label>
      <label class="setting-row"><span>Ambient drone</span><input type="checkbox" id="setAmbient" checked></label>
      <label class="setting-row"><span>Stroke metronome (BPM)</span><input type="checkbox" id="setMetronome" checked></label>
      <label class="setting-row">
        <span>Volume</span>
        <input type="range" id="setVolume" min="0" max="100" value="35">
      </label>
      <label class="setting-row">
        <span>Timer scale</span>
        <select id="setTimerScale">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Brutal strength</span>
        <select id="setBrutal">
          <option value="0.5">Mild</option>
          <option value="1" selected>Normal</option>
          <option value="1.5">Harsh</option>
          <option value="2">Merciless</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Corruption gain</span>
        <select id="setGain">
          <option value="0.7">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.4">Fast</option>
        </select>
      </label>

      <hr>
      <h3>Rule34 API</h3>
      <p class="hint">From rule34.xxx → Account → Options. Stored only in this browser.</p>
      <input type="text" id="r34UserId" placeholder="Rule34 User ID" autocomplete="off">
      <input type="password" id="r34ApiKey" placeholder="Rule34 API Key" autocomplete="off">

      <hr>
      <h3>Add Custom Fetish</h3>
      <input type="text" id="customName" placeholder="Full name">
      <input type="text" id="customShort" placeholder="Short name">
      <input type="text" id="customIronic" placeholder="Ironic instruction">
      <input type="text" id="customSearch" placeholder="ONE Rule34 tag (e.g. feet)">
      <button id="addCustomBtn" type="button">Add Fetish</button>
      <button id="closeSettings" class="secondary" type="button">Save &amp; Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
